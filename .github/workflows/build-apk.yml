name: Build APK (direto no Actions)

# Constrói o APK direto aqui no GitHub Actions, sem depender do EAS
# Build (cloud da Expo, que consome créditos pagos) nem do
# BuildForge externo (buildforge-worker.yml, que depende de um
# servidor de terceiro estar de pé). expo prebuild gera o projeto
# Android nativo, e o Gradle builda ele igual a um projeto Android
# comum — o mesmo princípio usado no MaximusPlayerNativeExact.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK (instalação manual, sem depender de action de terceiro)
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Instalar dependências
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Gerar o projeto Android nativo (expo prebuild)
        working-directory: frontend
        env:
          # As variáveis EXPO_PUBLIC_* já vêm do .env commitado no
          # repositório (yarn/Metro carrega ele sozinho) — não precisa
          # duplicar aqui, a menos que alguém queira sobrescrever numa
          # branch/build específica sem editar o .env.
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Buildar o APK (debug, sem assinatura de produção)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Encontrar o APK gerado
        id: apk
        working-directory: frontend
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Encontrado: $APK_PATH"

      - name: Enviar o APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: maximus-player-rn-debug-apk
          path: frontend/${{ steps.apk.outputs.path }}
          if-no-files-found: error
